# ─────────────────────────────────────────────
# PROJECT
# ─────────────────────────────────────────────
[project]
name = "ff-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
    "python-dotenv==1.0.1",
    "boto3==1.34.162",
    "botocore==1.34.162",
    "pydantic==2.10.6",
    "pydantic-settings>=2.0.0",
    "openai>=1.40.0",
    "aws-xray-sdk>=2.12.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "bandit",
    "httpx>=0.24.0",
    "pre-commit",
    "moto[sqs,secretsmanager]>=5.0.0",
    "respx>=0.21.0",
]

# ─────────────────────────────────────────────
# BUILD
# ─────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────
# RUFF — Linter
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (géré par le formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = [
    "ff_ingestion",
    "main",
    "config",
    "logger",
    "parser",
    "models",
    "sqs_consumer",
]

# ─────────────────────────────────────────────
# BANDIT — Sécurité
# ─────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"] # Skip assert_used dans les tests

# ─────────────────────────────────────────────
# PYTEST
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
markers = [
    "asyncio: mark test as async",
    "slow: mark test as slow",
    "integration: mark test as integration test",
]

# ─────────────────────────────────────────────
# COVERAGE
# ─────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]